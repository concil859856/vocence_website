[project]
name = "vocence-turn-detection"
version = "0.1.0"
description = "End-of-utterance detection pod for Vocence — Smart Turn v3 (audio) + LiveKit Turn Detector v2 (text)"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Vocence" }]

# Pin minor versions; bump deliberately. The two model libraries
# (transformers, onnxruntime) are the most likely sources of breakage.
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.40",
  "websockets>=13,<15",
  "pydantic>=2.8,<3.0",
  "numpy>=1.26,<3.0",
  "onnxruntime>=1.18,<2.0",
  "transformers>=4.45,<5.0",
  # Tokenizers + WhisperFeatureExtractor are part of transformers, but
  # they pull torch in by default. We only use feature extraction, not
  # the pytorch path — install torch-cpu explicitly to keep image small.
  "torch>=2.3,<3.0",
  "huggingface-hub>=0.25,<1.0",
  "prometheus-client>=0.21,<1.0",
  "python-multipart>=0.0.12,<1.0",   # for FastAPI multipart batch endpoints
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]   # we let black/ruff format handle line length

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
